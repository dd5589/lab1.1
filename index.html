<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портфолио фотографа</title>
    <style>
        body {
            background-color: #d3d3d3;
            color: #111111;         
        }

        img {
            filter: grayscale(100%);
            width: 300px;             
        }
    </style>
</head>
<body>

    <header>
        <h1>Вознесенский Фёдор</h1>
        <p>Фотограф и визуальный сторителлер</p>
        <img src="avatar.jpg" alt="Портрет автора">
    </header>

    <main>
        <section>
            <h2>Мои проекты</h2>
            <h3>Городской пейзаж ночью</h3>
            <ol>
                <li><img src="city-1.jpg" alt="Закат на бульваре, городской пейзаж"></li>
                <li><img src="city-2.jpg" alt="Огни ночной улицы"></li>
            </ol>
        </section>

        <section>
            <h3>Горы</h3>
            <ul>
                <li><img src="mntn-1.jpg" alt="Горная дорога вечером, осень"></li>
                <li><img src="mntn-2.jpg" alt="Горы Урала, вид с реки"></li>
            </ul>
        </section>

        <aside>
            <h3>Любимое направление</h3>
            <p>Городской пейзаж ночью</p>
        </aside>

        <section>
            <h2>Оставьте своё сообщение!</h2>
            <details>
                <summary>Форма заявки</summary>
                <form>
                    <p>
                        <label for="username">Ваше имя:</label><br>
                        <input type="text" id="username" name="user_name" required placeholder="Иван Иванов">
                    </p>
                    <input type="submit" value="Отправить">
                </form>
            </details>
        </section>
    </main>

    <footer>
        <address> 
            Контакты для связи <a href="mailto:fv@gmail.com">Вознесенский Фёдор</a>.
        </address>
        <p>© copyright 2026 Example Corp.</p>
    </footer>

</body>
</html>
